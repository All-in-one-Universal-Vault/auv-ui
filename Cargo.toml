[workspace]
resolver = "2"
members = ["crates/auv-i18n", "crates/auv-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MulanPSL-2.0 OR Apache-2.0"
authors = ["积澍技术"]

[workspace.dependencies]
eframe = "0.36"           # 锁线 0.36.2
egui = "0.36"             # 与 eframe 同版线（fonts/shell 的公共类型直用 egui）
fluent = "0.17"           # fluent-bundle 0.16 同线（Apache-2.0 OR MIT）
fluent-syntax = "0.12"    # 目录校验直用 AST（Apache-2.0 OR MIT）
unic-langid = "0.9"       # locale tag 解析与规范化（MIT OR Apache-2.0）
sys-locale = "0.3"        # 系统 UI 语言探测（MIT OR Apache-2.0）

[profile.release]
lto = true
strip = true
